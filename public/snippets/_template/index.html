<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snippet-Vorlage</title>
    <style>
      /* Ein Snippet ist ein eigenständiges Dokument: eigene Styles, eigenes
         JavaScript, eigene (optionale) Abhängigkeiten. Es weiß nichts vom
         Wrapper und kollidiert mit keinem anderen Snippet. */
      :root {
        color-scheme: light dark;
        --accent: #534ab7;
        --bg: #faf9f6;
        --fg: #1c1b19;
      }
      @media (prefers-color-scheme: dark) {
        :root { --accent: #afa9ec; --bg: #17171a; --fg: #f2f1ee; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      .card { text-align: center; padding: 2rem; }
      button {
        font: inherit;
        padding: 0.6rem 1.1rem;
        border: 1px solid var(--accent);
        border-radius: 8px;
        background: transparent;
        color: var(--accent);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Neues Snippet</h1>
      <p>Ersetze diese Datei durch dein eigenständiges HTML.</p>
      <button id="btn">Klicks: 0</button>
    </div>
    <script>
      // Snippets dürfen eigene Deps laden (z. B. per CDN-<script>) — der Wrapper
      // unterstützt aktiv aber nur reine HTML-Snippets wie dieses.
      const btn = document.getElementById('btn')
      let n = 0
      btn.addEventListener('click', () => { btn.textContent = `Klicks: ${++n}` })
    </script>
  </body>
</html>
