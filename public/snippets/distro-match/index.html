    {t:"Daily-drove Ubuntu or Mint a while. Ready for more.",w:{fd:2,su:2,mj:2,db:2,po:1,ev:1,cy:1,nb:1,mt:-1,zo:-2,el:-2,ub:-1,an:-1}},

    {t:"Zero. It is a tool, not a hobby.",w:{mt:3,zo:3,ub:2,el:2,an:2,po:2,mx:2,db:1,nb:1,ev:-3,nx:-3,cy:-1}},

    {t:"Tinkering is the point. I want to know how it works.",w:{ev:3,db:3,nx:3,cy:1,su:1,fd:1,mt:-3,zo:-3,el:-3,an:-3,ub:-2,po:-2,mx:-1,nb:-1}}]}
];

const IDS = Object.keys(DISTROS);
const stage = document.getElementById("stage");
const actions = document.getElementById("actions");
const pFill = document.getElementById("pFill");
const pTrack = document.getElementById("pTrack");
const pLabel = document.getElementById("pLabel");

let answers = QUESTIONS.map(() => []);
let current = 0;
let finished = false;

/* Per-distro min/max achievable totals, for normalizing raw scores to a
   percentage. Multi-select questions can stack every positive (or negative)
   option at once, so their bound is the sum, not the extreme. */
function scoreBounds() {
  const min = {}, max = {};
  IDS.forEach(id => { min[id] = 0; max[id] = 0; });
  for (const q of QUESTIONS) {
    for (const id of IDS) {
      const vals = q.o.map(o => o.w[id] || 0);
      if (q.multi) {
        for (const v of vals) { if (v > 0) max[id] += v; else min[id] += v; }
      } else {
        max[id] += Math.max(...vals);
        min[id] += Math.min(...vals);
      }
    }
  }
  return { min, max };
}

function tally() {
  const t = {};
  IDS.forEach(id => { t[id] = 0; });
  QUESTIONS.forEach((q, qi) => {
    for (const oi of answers[qi]) {
      const w = q.o[oi].w;
      for (const id in w) if (id in t) t[id] += w[id];
    }
  });
  return t;
}

function ranking() {
  const { min, max } = scoreBounds();
  const t = tally();
  return IDS
    .map(id => {
      const range = max[id] - min[id];
      const pct = range > 0 ? Math.round(((t[id] - min[id]) / range) * 100) : 50;
      return { id, pct };
    })
    .sort((a, b) => b.pct - a.pct || DISTROS[a.id].r - DISTROS[b.id].r);
}

/* Every picked answer that moved this distro, strongest first. */
function reasonsFor(id) {
  const out = [];
  QUESTIONS.forEach((q, qi) => {
    for (const oi of answers[qi]) {
      const v = q.o[oi].w[id] || 0;
      if (v !== 0) out.push({ v, t: q.o[oi].t });
    }
  });
  return out.sort((a, b) => b.v - a.v);
}

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) node.append(c);
  return node;
}

function setProgress(step, total, label) {
  pFill.style.width = (step / total) * 100 + "%";
  pTrack.setAttribute("aria-valuenow", String(step));
  pLabel.textContent = label;
}

function renderQuestion() {
  finished = false;
  const q = QUESTIONS[current];
  setProgress(current, QUESTIONS.length, (current + 1) + " / " + QUESTIONS.length);
  stage.replaceChildren(
    el("h1", { class: "q", text: q.q }),
    el("p", { class: "hint" },
      q.multi ? "Choose one or more — " : "Choose one — ",
      el("kbd", { text: "1" }), "–", el("kbd", { text: String(q.o.length) }),
      " selects, ", el("kbd", { text: "Enter" }), " continues, ",
      el("kbd", { text: "Backspace" }), " goes back."),
    ...q.o.map((o, i) => el("button", {
      class: "opt",
      type: "button",
      "aria-pressed": String(answers[current].includes(i)),
      onclick: () => pickOption(i)
    }, el("span", { class: "key", text: String(i + 1) }), el("span", { text: o.t })))
  );
  renderNav();
}

function pickOption(i) {
  const q = QUESTIONS[current];
  if (q.multi) {
    const at = answers[current].indexOf(i);
    if (at > -1) answers[current].splice(at, 1); else answers[current].push(i);
    stage.querySelectorAll(".opt")[i].setAttribute("aria-pressed", String(at === -1));
    renderNav();
  } else {
    answers[current] = [i];
    stage.querySelectorAll(".opt").forEach((b, bi) =>
      b.setAttribute("aria-pressed", String(bi === i)));
    setTimeout(advance, 140);
  }
}

function renderNav() {
  if (finished) return;
  actions.replaceChildren();
  if (current > 0) actions.append(el("button", {
    class: "btn", type: "button", text: "Back", onclick: () => { current--; renderQuestion(); }
  }));
  const next = el("button", {
    class: "btn primary", type: "button",
    text: current === QUESTIONS.length - 1 ? "See the ranking" : "Continue",
    onclick: advance
  });
  if (!answers[current].length) next.disabled = true;
  actions.append(next);
}

function advance() {
  if (!answers[current].length) return;
  if (current < QUESTIONS.length - 1) { current++; renderQuestion(); }
  else renderResults();
}

function summaryText(ranked) {
  const top = ranked.slice(0, 3)
    .map((x, i) => (i + 1) + ") " + DISTROS[x.id].n + " " + x.pct + "%").join(", ");
  const picks = [];
  QUESTIONS.forEach((q, qi) => answers[qi].forEach(oi => picks.push(q.o[oi].t)));
  return "distro-match result: " + top + ". Answers: " + picks.join(" | ");
}

function renderResults() {
  finished = true;
  setProgress(QUESTIONS.length, QUESTIONS.length, "done");
  const ranked = ranking();
  const win = ranked[0];
  const d = DISTROS[win.id];
  const rs = reasonsFor(win.id);
  const pros = rs.filter(x => x.v > 0).slice(0, 3);
  const cons = rs.filter(x => x.v < 0).slice(-1);

  const winner = el("section", { class: "winner" },
    el("span", { class: "tag", text: "best match" }),
    el("div", { class: "head" },
      el("span", { class: "name", text: d.n }),
      el("span", { class: "pct", text: win.pct + "%" })),
    el("p", { class: "desc", text: d.s }),
    el("div", { class: "chips" },
      el("span", { class: "chip", text: "base: " + d.b }),
      el("span", { class: "chip", text: d.c }),
      el("span", { class: "chip", text: d.d }),
      el("span", { class: "chip", text: "DistroWatch #" + d.r })),
    el("div", { class: "reasons" }, el("ul", {},
      ...pros.map(x => el("li", { class: "pro", text: x.t })),
      ...cons.map(x => el("li", { class: "con", text: "Working against it: " + x.t })))),
    el("a", { class: "dl", href: d.u, target: "_blank", rel: "noopener", text: "Download " + d.n + " ↗" }));

  const runners = el("div", { class: "runners" },
    ...ranked.slice(1, 3).map(x => {
      const rd = DISTROS[x.id];
      return el("div", { class: "runner" },
        el("div", { class: "head" },
          el("span", { class: "name", text: rd.n }),
          el("span", { class: "pct", text: x.pct + "%" })),
        el("div", { class: "meta", text: rd.b + " · " + rd.c }),
        el("p", { text: rd.s.split(". ")[0] + "." }));
    }));

  const list = el("div", {},
    el("h2", { class: "section", text: "full ranking — expand any row for the why" }),
    ...ranked.map((x, i) => {
      const rd = DISTROS[x.id];
      const rrs = reasonsFor(x.id);
      const body = el("div", { class: "body" },
        el("p", { text: rd.s }),
        el("ul", { class: "reasons" },
          ...rrs.filter(r => r.v > 0).slice(0, 3).map(r => el("li", { class: "pro", text: r.t })),
          ...rrs.filter(r => r.v < 0).slice(-2).map(r => el("li", { class: "con", text: r.t }))),
        rrs.length ? "" : el("p", { text: "None of your answers moved this one either way." }));
      const bar = el("i", {});
      const row = el("details", { class: "rank" + (i < 3 ? " top" : "") },
        el("summary", {},
          el("span", { class: "pos", text: String(i + 1) }),
          el("span", { class: "name", text: rd.n }),
          el("span", { class: "bar" }, bar),
          el("span", { class: "pct", text: x.pct + "%" })),
        body);
      requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.width = x.pct + "%"; }));
      return row;
    }),
    el("p", { class: "endnote",
      text: "Scores are normalized per distro against its own best and worst achievable totals, so 100% means every answer favored it. Contradictory answers pull everything toward the middle instead of inventing a winner. Field: DistroWatch 12-month page-hit ranking, which measures curiosity, not market share." }));

  stage.replaceChildren(winner, runners, list);

  const copyBtn = el("button", { class: "btn", type: "button", text: "Copy result" });
  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(summaryText(ranked));
      copyBtn.textContent = "Copied";
      copyBtn.classList.add("copied");
    } catch {
      copyBtn.textContent = "Copy failed — clipboard blocked";
    }
    setTimeout(() => { copyBtn.textContent = "Copy result"; copyBtn.classList.remove("copied"); }, 1800);
  });
  actions.replaceChildren(
    el("button", { class: "btn primary", type: "button", text: "Start over",
      onclick: () => { answers = QUESTIONS.map(() => []); current = 0; renderQuestion(); } }),
    copyBtn);
}

document.getElementById("themeToggle").addEventListener("click", function () {
  const dark = document.body.getAttribute("data-theme") === "dark";
  document.body.setAttribute("data-theme", dark ? "light" : "dark");
  this.textContent = dark ? "dark" : "light";
});
if (window.matchMedia("(prefers-color-scheme: light)").matches) {
  document.body.setAttribute("data-theme", "light");
  document.getElementById("themeToggle").textContent = "dark";
}

document.addEventListener("keydown", e => {
  if (finished || e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= QUESTIONS[current].o.length) { pickOption(n - 1); e.preventDefault(); }
  else if (e.key === "Enter" && answers[current].length) { advance(); e.preventDefault(); }
  else if (e.key === "Backspace" && current > 0) { current--; renderQuestion(); e.preventDefault(); }
});

renderQuestion();
</script>
</body>
