# Static host for the built dashboard. The production build is client-side only
# (hash routing, no writable backend), so this is plain static file serving plus
# a single-page fallback and cache rules split by how often each kind of file
# actually changes.
#
# nginx quirk worth knowing: add_header does NOT inherit into a location that
# sets its own add_header, so the nosniff header is repeated per block on
# purpose, not by accident.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets (dist/assets/*) are content-addressed: a change gives a
    # new filename, so they are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Snippet files and the generated manifest change whenever snippets change.
    # Revalidate so an edited or rebuilt snippet shows up without a hard refresh.
    location /snippets/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Hash-routed shell: real files (favicon, etc.) are served by try_files
    # first, everything else falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
